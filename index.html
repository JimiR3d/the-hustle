<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE HUSTLE Love & MONEY — Game Show Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@600;800;900&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>

  <!-- ==========================================================================
       INTRO PARALLAX SCROLLING SECTION (Opening Landing Page)
       ========================================================================== -->
  <section class="parallax-intro-section" id="intro-parallax-section">
    <div class="parallax-visuals" data-parallax-layers>
      <!-- Layer 1: Starry Sky Background -->
      <img src="/assets/parallax/sky.png" alt="Starry Sky" class="parallax-layer-img layer-sky" data-parallax-layer="sky" />

      <!-- Layer 2: Las Vegas City Skyline -->
      <img src="/assets/parallax/Buildings.png" alt="Las Vegas Skyline" class="parallax-layer-img layer-buildings" data-parallax-layer="buildings" />

      <!-- Layer 3: Desert Landscape / Ground -->
      <img src="/assets/parallax/Ground.png" alt="Desert Ground" class="parallax-layer-img layer-ground" data-parallax-layer="ground" />

      <!-- Layer 4: Top Hanging Glass Piggy Bank (Sits above logo & fade, natural scroll) -->
      <div class="parallax-layer-wrapper layer-piggy-wrapper">
        <img src="/assets/parallax/PiggyBank.png" alt="Hanging Piggy Bank" class="parallax-layer-img layer-piggy" />
      </div>

      <!-- Layer 5: Main Marquee Sign Center (Natural scroll) -->
      <img src="/assets/parallax/homeLogo.png" alt="Welcome to The Hustle Love & Money" class="parallax-layer-img layer-logo" />

      <!-- Layer 6: Hosts Cards (Bottom Left, natural scroll above gradient) -->
      <img src="/assets/parallax/Hosts.png" alt="Hosts Osmond and Esther" class="parallax-layer-img layer-hosts" />

      <!-- Layer 7: Motorclub Houston Roadside Sign (Bottom Right, natural scroll above gradient) -->
      <img src="/assets/parallax/signHustle.png" alt="Motorclub Houston Sign" class="parallax-layer-img layer-sign" />

      <!-- Layer 8: Sponsors Bar (Bottom Center, natural scroll above gradient) -->
      <img src="/assets/parallax/sponsoreLogoss.png" alt="Sponsors" class="parallax-layer-img layer-sponsors" />

      <!-- Bottom Black Gradient Fade (Smoothly darkens everything into black at bottom boundary) -->
      <div class="main-menu__bottom-fade" aria-hidden="true"></div>

      <!-- Pulsating Scroll Prompt -->
      <button class="scroll-to-arena-btn" id="scroll-to-arena-btn" type="button">
        <span class="scroll-btn-text">ENTER GAME SHOW ARENA</span>
        <span class="scroll-btn-arrow">↓</span>
      </button>
    </div>
  </section>

  <!-- ==========================================================================
       BLACK TRANSITION SECTION (Cinematic Buffer Between Main Menu & Game)
       ========================================================================== -->
  <section class="transition-buffer-section" id="transition-buffer-section" aria-hidden="true"></section>

  <!-- ==========================================================================
       MAIN ARENA SECTION (1920x1080 Scaled Arena Display Stage)
       ========================================================================== -->
  <section class="main-arena-section" id="main-arena-section">
    <!-- Top Black Gradient Fade (Smoothly transitions from black into Game Section) -->
    <div class="game-section__top-fade" aria-hidden="true"></div>

    <div id="app-stage">
      
      <!-- Theatrical Spotlight Backdrop Dimmer -->
      <div class="spotlight-backdrop" id="spotlight-backdrop" aria-hidden="true"></div>

      <!-- Top Header with Custom Logo Image & Dynamic HUD Timer -->
      <header class="display-header">
        <div class="logo-container">
          <img src="/assets/logo.png" alt="THE HUSTLE Love & MONEY" class="logo-img" />
        </div>

        <!-- Central HUD Game Countdown Timer -->
        <div class="hud-timer-badge" id="hud-timer-badge">
          <span class="hud-timer-label">GAME TIMER</span>
          <span class="hud-timer-clock" id="hud-clock">05:00</span>
        </div>
      </header>

      <!-- Main Stage Container (Active Team Groups Centered Dynamic Grid) -->
      <main class="groups-stage-container" id="groups-stage-container">
        <!-- Top Row -->
        <div class="groups-row" id="groups-row-top"></div>

        <!-- Bottom Row -->
        <div class="groups-row" id="groups-row-bottom"></div>
      </main>

      <!-- Disqualified Team Card Stack (Bottom-Right Corner) -->
      <aside class="disqualified-stack-container" id="disqualified-stack-container">
        <div class="disqualified-slot" id="dq-slot-0"></div>
        <div class="disqualified-slot" id="dq-slot-1"></div>
        <div class="disqualified-slot" id="dq-slot-2"></div>
        <div class="disqualified-slot" id="dq-slot-3"></div>
        <div class="disqualified-slot" id="dq-slot-4"></div>
      </aside>

      <!-- Footer Status Bar -->
      <footer class="display-footer">
        <div class="arena-status-badge">● LIVE ARENA BOARD</div>
        <div class="arena-watermark">THE HUSTLE LOVE & MONEY © 2026</div>
      </footer>

    </div>
  </section>

  <script type="module" src="/src/js/display.js"></script>
</body>
</html>
