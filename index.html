<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE HUSTLE Love & MONEY — Game Show Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@600;800;900&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>

  <!-- 1920x1080 Scaled Arena Display Stage -->
  <div id="app-stage">
    
    <!-- Theatrical Spotlight Backdrop Dimmer -->
    <div class="spotlight-backdrop" id="spotlight-backdrop" aria-hidden="true"></div>

    <!-- Top Header with Custom Logo Image & Dynamic HUD Timer -->
    <header class="display-header">
      <div class="logo-container">
        <img src="/assets/logo.png" alt="THE HUSTLE Love & MONEY" class="logo-img" />
      </div>

      <!-- Central HUD Game Countdown Timer -->
      <div class="hud-timer-badge" id="hud-timer-badge">
        <span class="hud-timer-label">GAME TIMER</span>
        <span class="hud-timer-clock" id="hud-clock">05:00</span>
      </div>
    </header>

    <!-- Main Stage Container (Active Team Groups Centered Dynamic Grid) -->
    <main class="groups-stage-container" id="groups-stage-container">
      <!-- Top Row -->
      <div class="groups-row" id="groups-row-top"></div>

      <!-- Bottom Row -->
      <div class="groups-row" id="groups-row-bottom"></div>
    </main>

    <!-- Disqualified Team Card Stack (Bottom-Right Corner) -->
    <aside class="disqualified-stack-container" id="disqualified-stack-container">
      <div class="disqualified-slot" id="dq-slot-0"></div>
      <div class="disqualified-slot" id="dq-slot-1"></div>
      <div class="disqualified-slot" id="dq-slot-2"></div>
      <div class="disqualified-slot" id="dq-slot-3"></div>
      <div class="disqualified-slot" id="dq-slot-4"></div>
    </aside>

    <!-- Footer Status Bar -->
    <footer class="display-footer">
      <div class="arena-status-badge">● LIVE ARENA BOARD</div>
      <div class="arena-watermark">THE HUSTLE LOVE & MONEY © 2026</div>
    </footer>

  </div>

  <script type="module" src="/src/js/display.js"></script>
</body>
</html>
